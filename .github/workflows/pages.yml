# Scans deals on a schedule, publishes the static dashboard to GitHub Pages.
#
# Cadence: every 6 hours (~13 min per scan fits the 2000 min/month free quota).
# State (SQLite dedup/alert history) persists via the actions cache, and the
# built site travels via artifacts — the workflow never commits, so local
# pushes never collide with bot runs. Manual runs: Actions tab ->
# "Scan and publish" -> Run workflow.
name: Scan and publish

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      zip:
        description: "ZIP code to scan (SerpApi locality + retailer context)"
        required: false
        default: "63017"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZIP_CODE: ${{ inputs.zip || '63017' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      TAKEADS_KEY: ${{ secrets.TAKEADS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Restore last run's DB so dedup/alert history survives (best effort;
      # a cold start simply re-seeds — provider keys are never cached).
      - uses: actions/cache/restore@v4
        id: dbcache
        with:
          path: data/dealhunter.db
          key: dealhunter-db-
          restore-keys: dealhunter-db-
      - run: python -m pip install -r requirements.txt
      # Browser binaries (user-space) + OS deps (needs root) installed separately.
      # NOTE: plain `sudo python` would resolve to /usr/bin/python (no packages!),
      # so pass the full setup-python interpreter path through sudo instead.
      - run: python -m playwright install chromium
      - run: sudo $(which python) -m playwright install-deps chromium
      - run: python -c "from app.scheduler import run_pipeline; print(run_pipeline())"
      - run: python scripts/export_static.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/dealhunter.db
          key: dealhunter-db-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
