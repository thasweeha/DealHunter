name: Deploy DealHunter to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/setup-pages@v5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dealhunter-site
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        with:
          page_type: static