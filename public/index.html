<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DealHunter Pro - Live Aggregator & ZIP Filter Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 font-['Inter',sans-serif]">
  <div class="min-h-screen flex flex-col bg-slate-100">
    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md py-4 px-6 flex justify-between items-center">
      <span class="text-xl font-extrabold tracking-tight">DEAL<span class="text-orange-500">HUNTER</span> PRO</span>
      <span class="text-xs bg-slate-800 border border-slate-700 px-3 py-1 rounded text-slate-300">
        Total Loaded Deals: <strong class="text-white" id="dealCount">0</strong>
      </span>
    </header>

    <!-- Filter Control Center -->
    <div class="max-w-7xl mx-auto w-full px-4 py-6">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">ZIP Code (Local In-Store)</label>
          <input type="text" id="zipInput" placeholder="e.g. 63017" maxlength="5" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Filter Store</label>
          <select id="storeSelect" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 outline-none">
            <option value="All Stores">All Stores</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Search Keywords</label>
          <input type="text" id="searchInput" placeholder="Search title, store..." class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 outline-none">
        </div>
      </div>
    </div>

    <!-- Main Content Panels -->
    <main class="max-w-7xl mx-auto w-full px-4 mb-16 flex-grow space-y-10">
      
      <!-- Section 1: Local In-Store Deals -->
      <section>
        <div class="flex items-center gap-2 mb-4">
          <span class="text-lg">📍</span>
          <h2 class="text-lg font-bold text-slate-900">Local & In-Store Deals Near Your ZIP</h2>
        </div>
        <div id="localDealsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </section>

      <!-- Section 2: Online & Nationwide Deals -->
      <section>
        <div class="flex items-center gap-2 mb-4">
          <span class="text-lg">📦</span>
          <h2 class="text-lg font-bold text-slate-900">Online & Nationwide Promotions</h2>
        </div>
        <div id="onlineDealsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </section>

    </main>
  </div>

  <!-- Reusable Card Template -->
  <template id="cardTemplate">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col hover:shadow-md transition-shadow">
      <div class="relative h-48 w-full bg-slate-200">
        <img src="" alt="Deal" class="w-full h-full object-cover deal-img" onerror="this.src='https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?auto=format&fit=crop&w=600&q=80'">
        <span class="absolute top-3 right-3 bg-orange-600 text-white text-[11px] font-bold px-2.5 py-1 rounded-full deal-badge">Live Offer</span>
      </div>
      <div class="p-5 flex flex-col flex-grow">
        <span class="text-xs font-bold uppercase text-blue-600 store-name mb-1">Store</span>
        <h3 class="font-bold text-slate-900 text-sm mb-4 line-clamp-2 deal-title">Title</h3>
        <div class="mt-auto pt-4 border-t border-slate-100 flex items-center justify-between">
          <span class="text-xs text-slate-400 deal-location">Nationwide</span>
          <a href="#" target="_blank" rel="noopener noreferrer" class="bg-orange-600 hover:bg-orange-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition-colors deal-link">
            Get Deal &rarr;
          </a>
        </div>
      </div>
    </div>
  </template>

<script>
    let rawDeals = [];

    async function loadDeals() {
      try {
        const response = await fetch('deals.json');
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        rawDeals = await response.json();
        populateStoreDropdown(rawDeals);
        applyFilters();
      } catch (err) {
        console.error("Error loading deals database:", err);
      }
    }

    function populateStoreDropdown(deals) {
      const storeSelect = document.getElementById('storeSelect');
      // Clear existing options except 'All Stores'
      storeSelect.innerHTML = '<option value="All Stores">All Stores</option>';
      const stores = [...new Set(deals.map(d => d.store).filter(Boolean))].sort();
      stores.forEach(store => {
        const option = document.createElement('option');
        option.value = store;
        option.textContent = store;
        storeSelect.appendChild(option);
      });
    }

    function applyFilters() {
      const zipVal = document.getElementById('zipInput').value.trim();
      const selectedStore = document.getElementById('storeSelect').value;
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      
      const isValidZip = /^\d{5}\$/.test(zipVal);

      const filtered = rawDeals.filter(deal => {
        const matchesStore = (selectedStore === 'All Stores' || deal.store === selectedStore);
        const matchesSearch = !searchVal || 
          deal.title.toLowerCase().includes(searchVal) || 
          deal.store.toLowerCase().includes(searchVal);
        return matchesStore && matchesSearch;
      });

      let localDeals = [];
      let onlineDeals = [];

      filtered.forEach(deal => {
        // If deal has a zip code attached:
        if (deal.zip_code && deal.zip_code !== "") {
          // If user typed a valid ZIP, match it. If ZIP input is empty, show them as default local picks.
          if (!isValidZip || deal.zip_code === zipVal) {
            localDeals.push(deal);
          }
        } else {
          onlineDeals.push(deal);
        }
      });

      renderSection('localDealsContainer', localDeals, isValidZip ? `No local deals found matching ZIP ${zipVal}` : 'Showing all available local items (Type a 5-digit ZIP code above to narrow down).');
      renderSection('onlineDealsContainer', onlineDeals, 'No online promotions match your filters.');
      
      document.getElementById('dealCount').textContent = filtered.length;
    }

    function renderSection(containerId, deals, emptyMessage) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = '';

      if (deals.length === 0) {
        container.innerHTML = `
          <div class="col-span-full bg-white rounded-xl p-8 text-center border border-slate-200 text-slate-500 text-sm shadow-sm">
            ${emptyMessage}
          </div>
        `;
        return;
      }

      deals.forEach(deal => {
        const clone = document.getElementById('cardTemplate').content.cloneNode(true);
        clone.querySelector('.deal-img').src = deal.image;
        clone.querySelector('.store-name').textContent = deal.store;
        clone.querySelector('.deal-title').textContent = deal.title;
        clone.querySelector('.deal-badge').textContent = deal.coupon || 'Hot Deal';
        clone.querySelector('.deal-location').textContent = deal.zip_code ? `ZIP: ${deal.zip_code}` : 'Online / Shipped';
        clone.querySelector('.deal-link').href = deal.url;
        container.appendChild(clone);
      });
    }

    // Event Listeners for real-time filtering
    document.getElementById('zipInput').addEventListener('input', applyFilters);
    document.getElementById('storeSelect').addEventListener('change', applyFilters);
    document.getElementById('searchInput').addEventListener('input', applyFilters);

    loadDeals();
  </script>
</body>
</html>
